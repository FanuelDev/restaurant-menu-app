name: Mobile — Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Decode keystore
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Build APK release
        working-directory: mobile
        env:
          ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEYALIAS }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEYPASSWORD }}
          ANDROID_STOREFILE: ../upload-keystore.jks
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_STOREPASSWORD }}
        run: flutter build apk --release

      - name: Build App Bundle (AAB) release
        working-directory: mobile
        env:
          ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEYALIAS }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEYPASSWORD }}
          ANDROID_STOREFILE: ../upload-keystore.jks
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_STOREPASSWORD }}
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
