# .github/workflows/deploy.yml
# ─────────────────────────────────────────────────────────────────────────────
# Déploiement sur VPS
#
# Frontend : build Angular sur le runner GitHub Actions → rsync dist/ sur VPS
# Backend  : build Docker sur le VPS
#
# Secrets GitHub (Settings → Secrets → Actions) :
#   VPS_HOST       — IP ou nom de domaine du VPS
#   VPS_USER       — Utilisateur SSH (ex: root)
#   VPS_SSH_KEY    — Clé privée SSH
#   VPS_PORT       — Port SSH (optionnel, défaut: 22)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_frontend:
        description: 'Forcer le déploiement du frontend'
        type: boolean
        default: false
      force_backend:
        description: 'Forcer le déploiement du backend'
        type: boolean
        default: false

# Les déploiements s'exécutent un par un — un nouveau push attend la fin du précédent
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Job 1 : Détection des changements ───────────────────────────────────────
  detect:
    name: Détecter les changements
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.resolve.outputs.frontend }}
      backend:  ${{ steps.resolve.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Analyser les fichiers modifiés
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'

      - name: Résoudre les cibles de déploiement
        id: resolve
        run: |
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          BACKEND="${{ steps.filter.outputs.backend }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.force_frontend }}" = "true" ] && FRONTEND="true"
            [ "${{ inputs.force_backend }}"  = "true" ] && BACKEND="true"
          fi

          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "backend=$BACKEND"   >> $GITHUB_OUTPUT

          echo "### Cibles de déploiement" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | Déployer ? |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $( [ \"$FRONTEND\" = 'true' ] && echo '✅ Oui' || echo '⏭️ Ignoré') |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | $( [ \"$BACKEND\"  = 'true' ] && echo '✅ Oui' || echo '⏭️ Ignoré') |" >> $GITHUB_STEP_SUMMARY

  # ── Job 2 : Build + déploiement Frontend ────────────────────────────────────
  deploy-frontend:
    name: Build & déployer Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Build Angular (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Configurer la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajouter le VPS aux known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Déployer les fichiers sur le VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          APP_DIR="/root/restaurant-menu-app"
          COMPOSE="docker compose -f $APP_DIR/docker-compose.yml -f $APP_DIR/docker-compose.prod.yml --env-file $APP_DIR/.env.production"

          # Mettre à jour la config sur le VPS (docker-compose.yml, nginx.conf, etc.)
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "cd $APP_DIR && git checkout -- . && git pull origin main && mkdir -p frontend-dist"

          # Synchroniser les fichiers compilés (quelques Mo, très rapide)
          rsync -avz --delete \
            -e "ssh -p $PORT" \
            frontend/dist/restaurant-menu/browser/ \
            "$VPS_USER@$VPS_HOST:$APP_DIR/frontend-dist/"

          # Redémarrer le conteneur Nginx pour servir les nouveaux fichiers
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "docker exec restaurant_frontend nginx -s reload 2>/dev/null || \
             $COMPOSE up -d --force-recreate frontend"

          echo "✅ Frontend déployé avec succès"

  # ── Job 3 : Build + déploiement Backend ─────────────────────────────────────
  deploy-backend:
    name: Build & déployer Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Déployer le backend sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            APP_DIR="/root/restaurant-menu-app"
            COMPOSE="docker compose -f $APP_DIR/docker-compose.yml -f $APP_DIR/docker-compose.prod.yml --env-file $APP_DIR/.env.production"
            cd "$APP_DIR"
            git checkout -- .
            git pull origin main
            echo "→ Building backend..."
            $COMPOSE build backend
            echo "→ Starting backend..."
            $COMPOSE up -d --remove-orphans backend
            docker image prune -f
            echo "Backend déployé avec succès"
