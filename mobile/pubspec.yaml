name: saemenus_client
description: Application client SaeMenus — Scan, Commander & Réserver
publish_to: 'none'
version: 1.0.3+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10

  # Navigation
  go_router: ^13.2.4

  # HTTP
  dio: ^5.4.3

  # QR Scanner
  mobile_scanner: ^5.1.1

  # Local storage
  shared_preferences: ^2.2.3

  # Images
  cached_network_image: ^3.3.1

  # UI / Animations
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  flutter_native_splash: ^2.4.1
  url_launcher: ^6.3.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#C0392B"
  image: assets/icon/logo.png
  android_12:
    color: "#C0392B"
    image: assets/icon/logo.png
    icon_background_color: "#C0392B"
  fullscreen: false

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
